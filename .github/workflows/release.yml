name: Release & Verification Workflow

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  test:
    name: Run Automated Test Suite
    runs-on: ubuntu-latest
    strategy:
      fail-fast: true
      matrix:
        php: ['8.2', '8.3', '8.4']

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup PHP Environment
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: mbstring, json, sodium, bcmath, curl
          coverage: none

      - name: Validate composer.json
        run: composer validate --strict

      - name: Install Composer Dependencies
        run: composer install --prefer-dist --no-progress --no-suggest

      - name: Execute PHPUnit Test Matrix
        run: vendor/bin/phpunit --colors=always

  release:
    name: Create GitHub Release
    needs: test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Create Release Notes
        id: release_notes
        run: |
          echo "## CodeLock Client Package ${{ github.ref_name }}" >> release_notes.md
          echo "" >> release_notes.md
          echo "Production release of the CodeLock Laravel licensing enforcement library." >> release_notes.md
          echo "" >> release_notes.md
          echo "### Verification" >> release_notes.md
          echo "- Full cryptographic verification suite passing on PHP 8.2 and PHP 8.3." >> release_notes.md
          echo "- Ed25519 signature enforcement verified." >> release_notes.md
          echo "- Nonce replay and monotonic clock defenses active." >> release_notes.md

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          body_path: release_notes.md
          draft: false
          prerelease: false
          generate_release_notes: true

